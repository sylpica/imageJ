<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ImageJ 学習・実務リファレンス</title>
<meta name="description" content="ImageJ/Fijiの原理を学び、実務の疑問をその場で解消する日本語リファレンス。四択問題・レッスン・公式ドキュメント日本語リファレンス・用語集を横断検索できます。">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
</head>
<body>
<header class="app-header">
  <a class="brand" href="#/home">ImageJ <span>学習・実務リファレンス</span></a>
  <form id="globalSearch" class="gsearch" role="search">
    <input id="gsInput" type="search" inputmode="search" autocomplete="off"
      placeholder="検索：閾値、Mean、ROI、背景補正…" aria-label="横断検索">
    <button type="submit" class="gs-btn" aria-label="検索する">検索</button>
  </form>
  <nav class="topnav" aria-label="メイン">
    <a href="#/lessons" data-nav="lessons">レッスン</a>
    <a href="#/quiz" data-nav="quiz">問題</a>
    <a href="#/docs" data-nav="docs">ドキュメント</a>
    <a href="#/functions" data-nav="functions">関数</a>
    <a href="#/practice" data-nav="practice">マクロ練習</a>
    <a href="#/terms" data-nav="terms">用語集</a>
  </nav>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="bottomnav" aria-label="モバイル">
  <a href="#/home" data-nav="home"><span class="bn-ic" aria-hidden="true">⌂</span>ホーム</a>
  <a href="#/lessons" data-nav="lessons"><span class="bn-ic" aria-hidden="true">▤</span>レッスン</a>
  <a href="#/quiz" data-nav="quiz"><span class="bn-ic" aria-hidden="true">?</span>問題</a>
  <a href="#/docs" data-nav="docs"><span class="bn-ic" aria-hidden="true">▦</span>文書</a>
  <a href="#/functions" data-nav="functions"><span class="bn-ic" aria-hidden="true">ƒ</span>関数</a>
  <a href="#/practice" data-nav="practice"><span class="bn-ic" aria-hidden="true">&lt;/&gt;</span>練習</a>
  <a href="#/terms" data-nav="terms"><span class="bn-ic" aria-hidden="true">あ</span>用語</a>
</nav>

<div id="termSheet" class="sheet" hidden role="dialog" aria-labelledby="tsTitle">
  <div class="sheet-card">
    <button type="button" class="sheet-close" id="tsClose" aria-label="閉じる">×</button>
    <h3 id="tsTitle"></h3>
    <p class="ts-en" id="tsEn"></p>
    <p id="tsDef"></p>
    <p class="ts-vs" id="tsVs"></p>
    <a id="tsLink" class="btn small" href="#/terms">用語集で詳しく見る</a>
  </div>
</div>

<script src="data-lessons.js"></script>
<script src="data-questions.js"></script>
<script src="data-docs.js"></script>
<script src="data-functions.js"></script>
<script src="app.js"></script>
</body>
</html>
